<main class="create-agent-page">



<section class="create-agent-card">

</div>



<h1>

CREATE

<br>

<span>
AGENT ACCOUNT
</span>

</h1>



<p>

Create limited access accounts for event management.

</p>








<form id="createAgentForm">



<div class="input-group">


<label>
Agent Name *
</label>


<input

type="text"

id="agentName"

placeholder="Enter agent name"

required

>


</div>









<div class="input-group">


<label>
Agent Email *
</label>


<input

type="email"

id="agentEmail"

placeholder="Enter agent email"

required

>


</div>









<div class="input-group">


<label>
Temporary Password *
</label>


<input

type="password"

id="agentPassword"

placeholder="Create password"

required

>


</div>









<button

type="submit"

id="createAgentBtn"

>

CREATE AGENT

</button>






<p id="agentStatus">

</p>
