<!DOCTYPE html>
<html lang="en">


<head>


<meta charset="UTF-8">


<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
BOTXCEL 2026 | Author Dashboard
</title>



<link rel="stylesheet"
href="css/style.css">


<link rel="stylesheet"
href="css/author.css">


</head>





<body>





<header class="author-header">


<div>


<h2>
BOTXCEL 2026
</h2>


<span>
AUTHOR DASHBOARD
</span>


</div>




<button id="logoutBtn">

Logout

</button>



</header>








<main class="author-page">





<div class="author-card">



<h1>

Create Announcement

</h1>



<p>

Publish updates for BOTXCEL participants.

</p>







<div class="input-group">


<label>

Announcement Title

</label>


<input

type="text"

id="title"

placeholder="Enter title"

>



</div>









<div class="input-group">


<label>

Announcement Message

</label>



<textarea

id="message"

rows="6"

placeholder="Write announcement..."

></textarea>



</div>








<div class="input-group">


<label>

Announcement Date

</label>


<input

type="date"

id="date"

>



</div>









<div class="input-group">


<label>

Priority

</label>



<select id="priority">


<option value="Normal">

Normal

</option>


<option value="Important">

Important

</option>


<option value="Urgent">

Urgent

</option>


</select>



</div>








<button

id="publishBtn"

class="publish-btn"

>

Publish Announcement

</button>








<p id="status">

</p>





</div>





</main>







<script

type="module"

src="js/author.js">

</script>



</body>


</html>
