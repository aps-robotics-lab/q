<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
BOTXCEL 2026 | Author Panel
</title>



<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/author.css">


</head>



<body>



<header class="site-header">


<div class="nav-container">


<div class="brand">

<strong>
BOTXCEL AUTHOR
</strong>

</div>



<button id="logoutBtn">

Logout

</button>


</div>


</header>








<main>



<section class="author-container">



<h1>

Author Dashboard

</h1>



<p>

Create BOTXCEL 2026 announcements

</p>








<div class="author-card">



<label>

Announcement Title

</label>


<input

id="title"

type="text"

placeholder="Enter title"

>







<label>

Message

</label>


<textarea

id="message"

placeholder="Enter announcement">

</textarea>







<label>

Date

</label>


<input

id="date"

type="text"

placeholder="25 August 2026"

>







<label>

Priority

</label>



<select id="priority">


<option value="NORMAL">

NORMAL

</option>


<option value="HIGH">

HIGH

</option>


</select>








<button id="publishBtn">

Publish Announcement

</button>





<p id="status">

</p>






</div>



</section>



</main>








<script

type="module"

src="js/author.js">

</script>



</body>

</html>
