<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
BOTXCEL 2026 | Author Dashboard
</title>


<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/author.css">


</head>


<body>


<!-- HEADER -->

<header class="author-header">


<div class="author-nav">


<div class="author-brand">


<strong>
BOTXCEL
</strong>


<span>
AUTHOR DASHBOARD
</span>


</div>



<button id="logoutBtn">

LOGOUT

</button>



</div>


</header>





<!-- MAIN -->


<main class="author-dashboard">



<section class="dashboard-heading">


<span>
BOTXCEL 2026 / AUTHOR
</span>


<h1>

INQUIRY

<br>

MANAGEMENT

</h1>


<p>

Manage visitor enquiries and event communication.

</p>


</section>







<!-- STATS -->


<section class="dashboard-stats">


<div class="stat-card">

<span>
TOTAL
</span>


<strong id="totalCount">
0
</strong>


</div>





<div class="stat-card">

<span>
PENDING
</span>


<strong id="pendingCount">
0
</strong>


</div>





<div class="stat-card">

<span>
SOLVED
</span>


<strong id="solvedCount">
0
</strong>


</div>



</section>







<!-- INQUIRY LIST -->


<section class="inquiry-section">


<h2>

INQUIRIES

</h2>



<div id="inquiryContainer">


<p>
Loading inquiries...
</p>


</div>



</section>





</main>






<script
type="module"
src="js/author-dashboard.js">
</script>



</body>

</html>
