<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Staff Login | APS LBS ROBOKRITI 2026</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<style>

*{
    box-sizing:border-box;
}

:root{
    --bg:#07090d;
    --panel:#0d1117;
    --panel2:#10151c;
    --border:rgba(255,255,255,.08);
    --text:#edf1f5;
    --muted:#7d8792;
    --orange:#ff4d00;
    --orange2:#ff6b28;
    --red:#ff5252;
    --green:#45d391;
}

body{
    margin:0;
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    color:var(--text);

    font-family:"Rajdhani",sans-serif;

    background:
        radial-gradient(
            circle at 50% 15%,
            rgba(255,77,0,.11),
            transparent 32%
        ),
        #07090d;
}

body::before{
    content:"";

    position:fixed;
    inset:0;

    pointer-events:none;

    opacity:.13;

    background-image:
        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        );

    background-size:45px 45px;
}

.login-page{
    width:min(430px,92%);
    position:relative;
    z-index:2;
}

.logo-area{
    text-align:center;
    margin-bottom:25px;
}

.logo{
    width:68px;
    height:68px;

    object-fit:contain;

    margin-bottom:14px;
}

.logo-area h1{
    margin:0;

    font-family:"Orbitron",sans-serif;

    font-size:1.05rem;

    letter-spacing:.5px;
}

.logo-area p{
    margin:7px 0 0;

    color:var(--orange);

    font-family:"Orbitron",sans-serif;

    font-size:.6rem;

    letter-spacing:1px;
}

.login-card{
    padding:30px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.025),
            rgba(255,255,255,.005)
        ),
        var(--panel);

    border:1px solid var(--border);

    border-radius:16px;

    box-shadow:
        0 25px 80px rgba(0,0,0,.45);
}

.card-heading{
    margin-bottom:24px;
}

.card-heading h2{
    margin:0 0 6px;

    font-family:"Orbitron",sans-serif;

    font-size:.95rem;
}

.card-heading p{
    margin:0;

    color:var(--muted);

    font-size:.72rem;
}

.field{
    margin-bottom:17px;
}

.field label{
    display:block;

    margin-bottom:7px;

    color:#8e98a2;

    font-size:.68rem;

    font-weight:700;

    letter-spacing:.4px;
}

.input-wrap{
    position:relative;
}

.input-wrap i{
    position:absolute;

    left:13px;
    top:50%;

    transform:translateY(-50%);

    color:#59636e;

    font-size:.75rem;
}

.input-wrap input{
    width:100%;

    padding:13px 42px;

    color:white;

    background:#090c11;

    border:1px solid rgba(255,255,255,.08);

    border-radius:8px;

    outline:none;

    font-family:"Rajdhani",sans-serif;

    font-size:.82rem;

    transition:.2s;
}

.input-wrap input:focus{
    border-color:rgba(255,77,0,.5);

    box-shadow:
        0 0 0 3px rgba(255,77,0,.06);
}

.password-toggle{
    position:absolute;

    right:12px;
    top:50%;

    transform:translateY(-50%);

    padding:3px;

    color:#59636e;

    background:none;

    border:0;

    cursor:pointer;
}

.password-toggle:hover{
    color:white;
}

.login-button{
    width:100%;

    margin-top:5px;

    padding:13px;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:9px;

    color:white;

    background:var(--orange);

    border:0;

    border-radius:8px;

    cursor:pointer;

    font-family:"Orbitron",sans-serif;

    font-size:.65rem;

    font-weight:700;

    transition:.2s;
}

.login-button:hover{
    background:var(--orange2);

    transform:translateY(-1px);
}

.login-button:disabled{
    opacity:.6;

    cursor:not-allowed;

    transform:none;
}

.message{
    display:none;

    margin-top:16px;

    padding:11px 12px;

    border-radius:7px;

    font-size:.7rem;

    line-height:1.45;
}

.message.error{
    display:block;

    color:#ff8585;

    background:rgba(255,82,82,.06);

    border:1px solid rgba(255,82,82,.15);
}

.message.success{
    display:block;

    color:#72e5ae;

    background:rgba(69,211,145,.06);

    border:1px solid rgba(69,211,145,.15);
}

.security{
    display:flex;

    align-items:flex-start;

    gap:9px;

    margin-top:20px;

    padding-top:17px;

    border-top:1px solid rgba(255,255,255,.05);

    color:#58626d;

    font-size:.62rem;

    line-height:1.5;
}

.security i{
    margin-top:2px;

    color:#59636e;
}

.home-link{
    display:block;

    margin-top:19px;

    text-align:center;

    color:#6d7781;

    text-decoration:none;

    font-size:.68rem;
}

.home-link:hover{
    color:white;
}

.loading-icon{
    display:none;
}

.loading .normal-icon{
    display:none;
}

.loading .loading-icon{
    display:inline-block;

    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

@media(max-width:450px){

    .login-card{
        padding:23px;
    }

}

</style>
</head>

<body>

<main class="login-page">

    <div class="logo-area">

        <img
        class="logo"
        src="https://i.ibb.co/4ZPrGYz7/Army-Welfare-Education-Society-logo-1.png"
        alt="Army Welfare Education Society Logo"
        >

        <h1>APS LBS ROBOKRITI</h1>

        <p>2026 • STAFF PORTAL</p>

    </div>


    <section class="login-card">

        <div class="card-heading">

            <h2>STAFF ACCESS</h2>

            <p>
                Sign in to access the ROBOKRITI management system.
            </p>

        </div>


        <form id="loginForm">

            <div class="field">

                <label for="email">
                    EMAIL ADDRESS
                </label>

                <div class="input-wrap">

                    <i class="fa-solid fa-envelope"></i>

                    <input
                    id="email"
                    type="email"
                    placeholder="Enter staff email"
                    autocomplete="username"
                    required
                    >

                </div>

            </div>


            <div class="field">

                <label for="password">
                    PASSWORD
                </label>

                <div class="input-wrap">

                    <i class="fa-solid fa-lock"></i>

                    <input
                    id="password"
                    type="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                    >

                    <button
                    type="button"
                    class="password-toggle"
                    id="togglePassword"
                    aria-label="Show password"
                    >

                        <i class="fa-solid fa-eye"></i>

                    </button>

                </div>

            </div>


            <button
            type="submit"
            class="login-button"
            id="loginButton"
            >

                <i class="fa-solid fa-right-to-bracket normal-icon"></i>

                <i class="fa-solid fa-spinner loading-icon"></i>

                <span id="buttonText">
                    SIGN IN
                </span>

            </button>


            <div
            id="message"
            class="message">
            </div>

        </form>


        <div class="security">

            <i class="fa-solid fa-shield-halved"></i>

            <span>
                This portal is restricted to authorised
                ROBOKRITI staff. Access permissions are
                controlled through Firebase Authentication
                and the staff database.
            </span>

        </div>

    </section>


    <a
    href="index.html"
    class="home-link"
    >

        <i class="fa-solid fa-arrow-left"></i>

        &nbsp; Return to public website

    </a>

</main>


<!-- =====================================================
     FIREBASE

     Firebase v10 modular SDK
===================================================== -->

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getDatabase,
    ref,
    get
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* =====================================================
   YOUR FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyDW7Wi_8ea-Ph1TvIEpobXeIFUQQox_Yhg",

    authDomain:
    "robokriti-2026.firebaseapp.com",

    databaseURL:
    "https://robokriti-2026-default-rtdb.firebaseio.com",

    projectId:
    "robokriti-2026",

    storageBucket:
    "robokriti-2026.firebasestorage.app",

    messagingSenderId:
    "914721813222",

    appId:
    "1:914721813222:web:57abd3093b8255330dc127",

    measurementId:
    "G-Z0S778MGZZ"

};


/* =====================================================
   INITIALISE FIREBASE
===================================================== */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const database = getDatabase(app);


/* =====================================================
   ELEMENTS
===================================================== */

const loginForm =
document.getElementById("loginForm");

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const loginButton =
document.getElementById("loginButton");

const buttonText =
document.getElementById("buttonText");

const message =
document.getElementById("message");

const togglePassword =
document.getElementById("togglePassword");


/* =====================================================
   PASSWORD VISIBILITY
===================================================== */

togglePassword.addEventListener(
    "click",
    () => {

        const isPassword =
        passwordInput.type === "password";

        passwordInput.type =
        isPassword ? "text" : "password";

        togglePassword.innerHTML =
        isPassword
        ? '<i class="fa-solid fa-eye-slash"></i>'
        : '<i class="fa-solid fa-eye"></i>';

    }
);


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text,type){

    message.textContent = text;

    message.className =
    "message " + type;

}


/* =====================================================
   LOADING
===================================================== */

function setLoading(loading){

    loginButton.disabled = loading;

    loginButton.classList.toggle(
        "loading",
        loading
    );

    buttonText.textContent =
    loading ? "AUTHENTICATING..." : "SIGN IN";

}


/* =====================================================
   LOGIN
===================================================== */

loginForm.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();

        showMessage("","");

        const email =
        emailInput.value.trim();

        const password =
        passwordInput.value;


        if(!email || !password){

            showMessage(
                "Please enter your email and password.",
                "error"
            );

            return;
        }


        setLoading(true);


        try{

            /*
             * Firebase Authentication
             */

            const credential =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


            const uid =
            credential.user.uid;


            /*
             * Read staff profile.
             *
             * IMPORTANT:
             * The browser does NOT decide
             * whether the user is admin,
             * author or agent.
             *
             * Firebase Realtime Database
             * rules remain responsible for
             * access control.
             */

            const staffSnapshot =
            await get(
                ref(database,"staff/" + uid)
            );


            if(!staffSnapshot.exists()){

                await auth.signOut();

                showMessage(
                    "Your account is authenticated, but no staff profile was found.",
                    "error"
                );

                setLoading(false);

                return;
            }


            const staff =
            staffSnapshot.val();


            /*
             * Active staff check
             */

            if(staff.active !== true){

                await auth.signOut();

                showMessage(
                    "Your staff account is currently inactive. Please contact the administrator.",
                    "error"
                );

                setLoading(false);

                return;
            }


            /*
             * Save ONLY non-sensitive UI information.
             *
             * Firebase Authentication remains
             * the actual identity system.
             */

            sessionStorage.setItem(
                "robokritiStaffRole",
                staff.role || ""
            );


            sessionStorage.setItem(
                "robokritiStaffName",
                staff.name || ""
            );


            showMessage(
                "Authentication successful. Opening staff dashboard...",
                "success"
            );


            /*
             * Dashboard will be created next.
             */

            setTimeout(
                () => {

                    window.location.href =
                    "dashboard.html";

                },
                700
            );


        }catch(error){

            console.error(
                "ROBOKRITI login error:",
                error
            );


            let errorMessage =
            "Unable to sign in. Please check your credentials.";


            switch(error.code){

                case "auth/invalid-credential":

                case "auth/invalid-login-credentials":

                    errorMessage =
                    "Incorrect email or password.";

                    break;


                case "auth/user-not-found":

                    errorMessage =
                    "No Firebase account exists for this email.";

                    break;


                case "auth/wrong-password":

                    errorMessage =
                    "Incorrect password.";

                    break;


                case "auth/too-many-requests":

                    errorMessage =
                    "Too many attempts. Please try again later.";

                    break;


                case "auth/network-request-failed":

                    errorMessage =
                    "Network error. Check your internet connection.";

                    break;


                case "auth/invalid-email":

                    errorMessage =
                    "Please enter a valid email address.";

                    break;

            }


            showMessage(
                errorMessage,
                "error"
            );


            setLoading(false);

        }

    }
);

</script>

</body>
</html>
